    <script type="module">
        import { initWardSelector } from './js/wardSelector.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Initialize Dropdowns
            initWardSelector();

            // 2. Initialize Leaflet Map
            const map = L.map('map').setView([-30.5595, 22.9375], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            let currentMarker = null;

            // Auto-locate user
            map.locate({setView: true, maxZoom: 16});

            map.on('locationfound', (e) => {
                // Save coordinates for ReportPage.js to use when submitting!
                window.mapLat = e.latlng.lat;
                window.mapLng = e.latlng.lng;

                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker(e.latlng).addTo(map).bindPopup("You are here").openPopup();
            });

            map.on('locationerror', (e) => {
                console.warn("Location access denied. Defaulting to national view.");
                map.setView([-30.5595, 22.9375], 5);
            });

            // Allow user to click the map to set custom location
            map.on('click', (e) => {
                window.mapLat = e.latlng.lat;
                window.mapLng = e.latlng.lng;

                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker(e.latlng).addTo(map).bindPopup("Pothole Location Selected").openPopup();
            });
        });
    </script>
